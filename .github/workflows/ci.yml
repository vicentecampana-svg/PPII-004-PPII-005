name: CI

on:
  push:
    branches: [ "main", "Backend" ]
  pull_request:
    branches: [ "main", "Backend" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: techhub_ci
          POSTGRES_USER: techhub_ci
          POSTGRES_PASSWORD: techhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U techhub_ci -d techhub_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DATABASE: techhub_ci
      PG_USER: techhub_ci
      PG_PASSWORD: techhub_ci

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2
        extensions: pdo, pdo_pgsql

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Los repositorios/servicios usan una conexión PDO real (ver app/helpers.php),
    # así que varios tests (auditoría, rate limiter) necesitan que las tablas
    # existan de verdad, no solo un mock. El contenido de las filas no importa
    # para los tests, solo el esquema.
    - name: Seed test database
      run: psql "postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}" -f config/schema.sql

    - name: PHP Syntax Check
      run: find app/ -name "*.php" -exec php -l {} \;

    - name: Run PHP CodeSniffer
      run: vendor/bin/phpcs -n --standard=PSR12 app/

    - name: Run Tests
      run: vendor/bin/phpunit

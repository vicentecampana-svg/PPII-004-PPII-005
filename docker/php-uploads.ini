; Límites de subida para el entorno Docker.
;
; El límite de negocio real (máx. 5MB, solo JPG/PNG) lo aplica
; App\Services\MediaService cuando el archivo llega a la app.
;
; post_max_size por defecto es 8M: si el body supera ese tamaño, PHP descarta
; TODO el request antes de ejecutar la app (deja $_FILES vacío y emite el warning
; "POST Content-Length ... exceeds the limit"). Subiendo post_max_size, cualquier
; archivo sobredimensionado llega a la app y se rechaza con un mensaje limpio.
;
; upload_max_filesize se sube a 6M (sobre el límite de 5M de la app) para que un
; archivo de 5-6MB llegue a MediaService y rechace con el mensaje exacto de 5MB;
; si excede 6M, PHP lo marca con UPLOAD_ERR_INI_SIZE y MediaService lo traduce a
; un mensaje descriptivo igualmente.
upload_max_filesize = 6M
post_max_size = 100M